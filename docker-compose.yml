services:
  quant-bot:
    image: my-quantbot/hybrid:v1.0
    build: .
    container_name: quant_bot_container
    # 컨테이너가 죽으면 자동으로 재시작 (안정성 확보)
    restart: unless-stopped
    # 호스트의 .env 파일을 컨테이너 내부로 로드
    env_file:
      - .env
    ports:
      - "58000:58000"
    volumes:
      # [중요] 로컬의 데이터와 모델을 컨테이너와 공유하여 영구 보존
      - ./src/data:/app/src/data
      - ./src/models:/app/src/models
      # 필요시 소스코드 수정 즉시 반영을 위해 아래 주석 해제 가능 (개발용)
      # - .:/app
    environment:
      - TZ=Asia/Seoul  # 한국 시간 설정 (로그 확인용)
    # 로그 설정 (용량 무제한 방지)
    logging:
      driver: "json-file"
      options:
        # 파일 하나당 최대 크기 (하루치 넉넉하게 잡음)
        max-size: "50m" 
        # 최대 파일 개수 (7일 + 여유분 1~3개 = 10개 추천)
        max-file: "10"
