services:
  quantbot:
    container_name: quantbot_v2
    image: binance-quant-bot:latest 
    build:
      context: .
      dockerfile: Dockerfile
    
    # 컨테이너가 멈추지 않는 한 자동 재시작 (오류 발생 시 복구)
    restart: unless-stopped
    
    # 포트 포워딩 (호스트:컨테이너)
    ports:
      - "58000:58000"
    
    # 환경 변수 파일 로드
    env_file:
      - .env
    
    # 데이터 영속성 및 시간 설정
    volumes:
      # 1. 데이터베이스 및 CSV 파일 저장소 (호스트와 동기화)
      - ./src/data:/app/src/data
      # 2. 학습된 AI 모델 저장소
      - ./src/models:/app/src/models
      # 3. 설정 파일 (컨테이너 재시작 없이 설정 변경 가능하게 하려면 주석 해제)
      # - ./src/config.json:/app/src/config.json
      # 4. 호스트의 시간대(Timezone)를 컨테이너와 동기화 (트레이딩 필수)
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    # 컨테이너 내부 환경 변수 추가 설정 (필요 시)
    environment:
      - TZ=Asia/Seoul