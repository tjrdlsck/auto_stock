version: '3.8'

services:
  quantbot:
    container_name: binance-quant-bot
    build: .
    restart: always
    
    # [핵심 수정] 경로 매핑을 현재 구조에 맞게 변경
    volumes:
      # 호스트의 src/data -> 컨테이너의 /app/src/data
      - ./src/data:/app/src/data
      
      # 호스트의 src/models -> 컨테이너의 /app/src/models
      # (탐색기에 models 폴더가 안 보여도 자동으로 생성되어 연결됩니다)
      - ./src/models:/app/src/models
      
      # 호스트의 .env -> 컨테이너 내부 실행 위치의 .env
      - ./.env:/app/src/.env
    
    environment:
      - PYTHONUNBUFFERED=1